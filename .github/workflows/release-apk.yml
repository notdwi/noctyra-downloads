name: Publish APK release

on:
  push:
    branches: [apk-builds]
    paths: ["incoming/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-apk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_apk.py
